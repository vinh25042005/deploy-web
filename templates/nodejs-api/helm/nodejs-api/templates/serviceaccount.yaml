# Least privilege: không mount service account token vào app (chỉ cần khi
# app thực sự gọi K8s API — khi đó hãy thêm RBAC riêng theo từng quyền).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodejs-api.fullname" . }}
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
