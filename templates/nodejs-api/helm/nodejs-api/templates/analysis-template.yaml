{{- if .Values.rollout.analysis.enabled }}
# Metrics gate cho canary: chỉ promote tiếp khi tỉ lệ 2xx/3xx đạt ngưỡng.
# Metric nginx_ingress_controller_requests có sẵn từ servicemonitor-ingress-nginx.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: {{ .Values.namespace }}
spec:
  metrics:
    - name: success-rate
      interval: {{ .Values.rollout.analysis.successRate.interval }}
      count: {{ .Values.rollout.analysis.successRate.count }}
      failureLimit: {{ .Values.rollout.analysis.successRate.failureLimit }}
      successCondition: result >= {{ .Values.rollout.analysis.successRate.min }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheus | quote }}
          # {{ "{{" }}args.service{{ "}}" }} là biến của Argo Rollouts,
          # phải escape để Helm không render.
          query: |
            sum(rate(nginx_ingress_controller_requests{service="{{ "{{" }}args.service{{ "}}" }}",status=~"2..|3.."}[2m]))
            /
            sum(rate(nginx_ingress_controller_requests{service="{{ "{{" }}args.service{{ "}}" }}"}[2m]))
{{- end }}
