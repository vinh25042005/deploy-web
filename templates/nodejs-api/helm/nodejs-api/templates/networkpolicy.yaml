# Mặc định chỉ cho ingress vào cổng http. Điều chỉnh theo nhu cầu
# (vd: giới hạn namespaceSelector, thêm egress nếu app cần gọi ra ngoài).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nodejs-api.fullname" . }}
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "nodejs-api.name" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
