---
# Playbook: Cài đặt Kubernetes cluster (kubeadm)
# Chạy sau khi Terraform tạo xong EC2 instances
#
# Usage:
#   ansible-playbook -i inventory.yml playbooks/k8s-cluster.yml
# ===============================================================

- name: Prepare all K8s nodes (containerd + kubeadm + kubectl + kubelet)
  hosts: k8s_cluster
  become: yes
  roles:
    - common

- name: Initialize master node (kubeadm init + Calico + upload SSM)
  hosts: master
  become: yes
  serial: 1
  roles:
    - master

- name: Join additional control-plane nodes
  hosts: workers
  become: yes
  serial: 1
  roles:
    - worker

- name: Join ingress/worker nodes
  hosts: ingress
  become: yes
  serial: 1
  roles:
    - worker

# ─── Post-deploy: untaint + cert-manager + setup PV ───
- name: Post-deploy tasks (cert-manager, PV, untaint)
  hosts: master[0]
  become: yes
  vars_files:
    - ../vars/secrets.yml
  tasks:
    - name: Remove control-plane taint from all masters
      shell: |
        kubectl taint nodes --all node-role.kubernetes.io/control-plane- 2>/dev/null || true
      changed_when: false

    - name: Taint ingress nodes (chỉ ingress-nginx được schedule)
      shell: |
        NODE_NAME=$(kubectl get nodes -o json | \
          jq -r '.items[] | select(.status.addresses[] | select(.type=="InternalIP" and .address=="{{ hostvars[item].ansible_default_ipv4.address }}")) | .metadata.name')
        if [ -n "$NODE_NAME" ] && [ "$NODE_NAME" != "null" ]; then
          kubectl taint node $NODE_NAME role=ingress:NoSchedule --overwrite 2>/dev/null || true
          kubectl label node $NODE_NAME role=ingress --overwrite 2>/dev/null || true
          echo "Labeled $NODE_NAME as ingress"
        else
          echo "WARNING: Could not find K8s node for {{ hostvars[item].ansible_default_ipv4.address }}"
        fi
      loop: "{{ groups['ingress'] }}"
      changed_when: false

    - name: Install cert-manager (CRDs + manifest + fix RBAC + CA)
      shell: |
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.0/cert-manager.crds.yaml 2>/dev/null || true
        kubectl create namespace cert-manager 2>/dev/null || true
        kubectl apply -n cert-manager \
          -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.0/cert-manager.yaml
        kubectl wait --for=condition=available --timeout=3m \
          -n cert-manager deployment/cert-manager-webhook

        # Fix RBAC leader election
        kubectl create clusterrole cert-manager-leader-election --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null
        kubectl patch clusterrole cert-manager-leader-election --type json -p='[{"op":"add","path":"/rules/-","value":{"apiGroups":["coordination.k8s.io"],"resources":["leases"],"verbs":["get","list","watch","create","update","patch","delete"]}}]' 2>/dev/null || true
        kubectl create clusterrolebinding cert-manager-leader-election --clusterrole=cert-manager-leader-election --serviceaccount=cert-manager:cert-manager --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null
        kubectl rollout restart -n cert-manager deployment/cert-manager
        kubectl wait --for=condition=available --timeout=2m -n cert-manager deployment/cert-manager
        sleep 10

        # Inject CA vào validating + mutating webhooks nếu cainjector chưa làm
        CA=$(kubectl get secret -n cert-manager cert-manager-webhook-ca -o jsonpath='{.data.tls\.crt}' 2>/dev/null || echo "")
        if [ -n "$CA" ]; then
          for wh_type in validating mutating; do
            CURRENT_CA=$(kubectl get ${wh_type}webhookconfigurations cert-manager-webhook -o json | jq -r '.webhooks[0].clientConfig.caBundle' 2>/dev/null)
            if [ "$CURRENT_CA" != "$CA" ]; then
              kubectl patch ${wh_type}webhookconfigurations cert-manager-webhook \
                --type json -p="[{\"op\": \"replace\", \"path\": \"/webhooks/0/clientConfig/caBundle\", \"value\": \"$CA\"}]"
            fi
          done
        fi
      changed_when: false

    - name: Install kube-prometheus-stack CRDs (server-side, tránh lỗi >262KB)
      shell: |
        CRD_BASE="https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.75.0/example/prometheus-operator-crd"
        for crd in alertmanagers alertmanagerconfigs podmonitors probes prometheuses prometheusagents prometheusrules scrapeconfigs servicemonitors thanosrulers; do
          curl -sL "$CRD_BASE/monitoring.coreos.com_${crd}.yaml" | kubectl apply --server-side -f - 2>/dev/null || true
        done
      changed_when: false

    - name: Install ArgoCD (server-side để tránh lỗi CRD >262KB)
      shell: |
        kubectl create namespace argocd 2>/dev/null || true
        curl -sL https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml | \
          kubectl apply --server-side -n argocd -f -
        kubectl wait --for=condition=available --timeout=3m \
          -n argocd deployment/argocd-server
      changed_when: false

    # ── [Mentor-style] Provision app k8s Secrets từ Vault (chạy trên control node) ──
    #   get vault → tạo k8s Secret → app (helm) mount. Chạy TRƯỚC khi ArgoCD deploy app.
    #   Control node (localhost) có AWS creds đọc SSM + kubeconfig + Vault access.
    - name: Provision app k8s Secrets từ Vault
      delegate_to: localhost
      become: false
      run_once: true
      shell: |
        set -euo pipefail
        # Kubeconfig mới nhất từ SSM (master upload sau kubeadm init) — kubectl đúng cluster VỪA apply
        # (local kubeconfig cũ có thể đang trỏ cluster đã destroy → kubectl fail).
        aws ssm get-parameter --name /k8s/kubeconfig --with-decryption \
          --region ap-southeast-1 --query Parameter.Value --output text \
          | base64 -d | gunzip > ~/.kube/config
        chmod 600 ~/.kube/config

        VAULT_ADDR="https://52.221.18.86:8200"
        VAULT_TOKEN="$(aws ssm get-parameter --name /techshop/vault-root-token \
          --with-decryption --region ap-southeast-1 --query Parameter.Value --output text)"
        vget() { curl -sk -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/$1" | jq -r "$2"; }

        PG_PASS="$(vget secret/data/postgres '.data.data.password')"
        JWT_SEC="$(vget secret/data/jwt '.data.data.secret')"
        GRAFANA_PASS="$(vget secret/data/grafana '.data.data.admin_password')"
        COSIGN_PUB="$(vget secret/data/cosign '.data.data.public_key')"

        for NS in techshop-dev techshop-stg; do
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f - >/dev/null

          # App secrets (mentor style — app mount qua secretRef)
          kubectl create secret generic backend-env-secret -n "$NS" \
            --from-literal=DATABASE_URL="postgresql://postgres:$PG_PASS@postgres:5432/shopdb?schema=public" \
            --from-literal=JWT_SECRET="$JWT_SEC" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic postgres-secret -n "$NS" \
            --from-literal=password="$PG_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic grafana-secret -n "$NS" \
            --from-literal=admin-user=admin \
            --from-literal=admin_password="$GRAFANA_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -

          printf '%s' "$COSIGN_PUB" > /tmp/cosign.pub
          kubectl create secret generic cosign-pub -n "$NS" \
            --from-file=cosign.pub=/tmp/cosign.pub \
            --dry-run=client -o yaml | kubectl apply -f -
        done
        echo ">>> Đã tạo app k8s Secrets từ Vault (backend-env, postgres, grafana, cosign)"
      args:
        executable: /bin/bash   # BẮT BUỘC: set -o pipefail không có trong /bin/sh (dash)
      changed_when: false

    - name: Add repository credential to ArgoCD
      shell: |
        kubectl apply -f - <<'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: repo-deploy-web
          namespace: argocd
          labels:
            argocd.argoproj.io/secret-type: repository
        stringData:
          type: git
          url: https://github.com/vinh25042005/deploy-web.git
          username: vinh25042005
          password: {{ github_token }}
        EOF
      changed_when: false

    - name: Create namespaces for imagePullSecret
      shell: |
        kubectl create namespace techshop-dev --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Create Docker Hub imagePullSecret (cho node pull image khỏi rate limit)
      shell: |
        kubectl create secret docker-registry dockerhub-secret \
          -n {{ item }} \
          --docker-server=docker.io \
          --docker-username=vinh2504 \
          --docker-password={{ dockerhub_pat }} \
          --dry-run=client -o yaml | kubectl apply -f -
      loop:
        - techshop-dev
        - techshop-stg
        - argocd
      changed_when: false

    - name: Create self-signed ClusterIssuer (cho Ingress TLS, tránh ArgoCD health check issue)
      shell: |
        kubectl apply -f - <<'EOF'
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: techshop-selfsigned-issuer
        spec:
          selfSigned: {}
        EOF
        kubectl wait --for=condition=ready --timeout=60s clusterissuer/techshop-selfsigned-issuer 2>/dev/null || true
      changed_when: false

    - name: Get AWS region
      shell: curl -s http://169.254.169.254/latest/meta-data/placement/region
      register: aws_region
      changed_when: false

    - name: Check for available EBS volumes (10Gi) — volume cũ còn data
      shell: |
        aws ec2 describe-volumes \
          --filters "Name=status,Values=available" "Name=size,Values=10" \
          --region "{{ aws_region.stdout }}" \
          --query 'Volumes[0].VolumeId' --output text
      register: old_vol
      changed_when: false

    - name: Create PV from existing EBS volume (để StatefulSet dùng lại data)
      when: old_vol.stdout | length > 12
      shell: |
        kubectl delete pv postgres-data-old 2>/dev/null || true
        kubectl apply -f - <<EOFM
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          name: postgres-data-old
        spec:
          capacity:
            storage: 10Gi
          volumeMode: Filesystem
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Retain
          storageClassName: techshop-ssd-immediate
          claimRef:
            name: pgdata-postgres-0
            namespace: techshop
          awsElasticBlockStore:
            volumeID: {{ old_vol.stdout }}
            fsType: ext4
        EOFM
      changed_when: false

    # ── CUỐI CÙNG: apply ArgoCD root app (app-of-apps) — SAU mọi prerequisite ──
    #   (repo credential, dockerhub-secret, ClusterIssuer, app secrets, PV) để
    #   ArgoCD sync app thành công NGAY LẦN ĐẦU — tránh "cài này cần cái kia".
    - name: Apply ArgoCD root app (app-of-apps)
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/vinh25042005/deploy-web/week-6-argo-rollouts/argocd/root.yaml
      changed_when: false
