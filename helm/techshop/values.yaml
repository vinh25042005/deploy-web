namespace: techshop-dev

# ─── Secrets: đọc TRỰC TIẾP từ Vault (Vault Agent Injector / vault CLI) — KHÔNG dùng ESO ───
#   - backend / postgres / grafana: Vault Agent Injector tiêm thẳng vào pod
#   - backup CronJob: vault CLI + kubernetes auth
#   - cosign-pub / dockerhub-secret: pipeline (Jenkins) tạo từ Vault (xem Jenkinsfile)

images:
  backend: docker.io/vinh2504/deploy-web-backend:latest
  frontend: docker.io/vinh2504/deploy-web-frontend:latest
  postgres: postgres:16-alpine

backend:
  enabled: true
  replicas: 2
  port: 3001
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

frontend:
  enabled: true
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

postgres:
  enabled: true        # Postgres in-cluster với backup S3
  replicas: 1
  port: 5432
  user: postgres
  # password: Vault Agent Injector tự động inject qua sidecar (xem templates/postgres.yaml)
  database: shopdb
  # ↑ backup CronJob đọc password trực tiếp từ Vault bằng vault CLI (xem templates/postgres-backup.yaml)
  storage:
    size: 10Gi
    className: techshop-ssm-waitforfirstconsumer
  backup:
    enabled: true
    schedule: "0 */6 * * *"           # 6 giờ 1 lần
    s3Bucket: techshop-loki-790400775134
    s3Region: ap-southeast-1

config:
  nodeEnv: production
  jwtExpiresIn: 7d
  frontendUrl: http://techshop.local
  backendInternalUrl: http://backend:3001
  # jwtSecret: lấy từ K8s Secret (jwt-secret) do External Secrets đồng bộ từ Vault
  # databaseUrl: lấy từ K8s Secret (database-url) do External Secrets đồng bộ từ Vault

ingress:
  className: nginx
  host: techshop.local
  tlsSecret: techshop-tls
  tls:
    enabled: true    # cert-manager + selfsigned ClusterIssuer

# ─── cert-manager — Ansible đã cài CRDs + Helm chart, subchart chỉ dùng fallback ───
cert-manager:
  installCRDs: false

# ─── NGINX Ingress Controller subchart ───
ingress-nginx:
  controller:
    hostNetwork: true
    kind: DaemonSet
    daemonset:
      useHostPort: true
    service:
      type: ClusterIP
    nodeSelector:
      role: ingress
    tolerations:
      - key: role
        operator: Equal
        value: ingress
        effect: NoSchedule
    admissionWebhooks:
      enabled: false
    # ─── Metrics cho AnalysisTemplate (Argo Rollouts) ───
    # Bật /metrics port 10254 → tạo Service <name>-controller-metrics
    # ServiceMonitor tạo riêng (servicemonitor-ingress-nginx.yaml) có label release để Prometheus chọn được
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false   # subchart không gắn label release → tắt, dùng template riêng

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 50

# ─── Storage ───
# EBS CSI driver được Terraform cài cluster-wide trong kube-system,
# nên KHÔNG cài qua chart này ở bất kỳ env nào (tránh trùng lặp driver).
storage:
  ebsCSI:
    enabled: false

# ─── Metrics Server (cho HPA) ───
metrics-server:
  args:
    - --kubelet-insecure-tls

# ─── kube-prometheus-stack (Prometheus + Grafana + Alertmanager) ───
# LƯU Ý: values của subchart phải nằm dưới ĐÚNG key "kube-prometheus-stack" (tên dependency).
# Trước đây để lồng trong "monitoring.kube-prometheus-stack" → Helm BỎ QUA → stack chạy mặc định
# (alertmanager bật, admission webhook bật → PreSync hooks kẹt ArgoCD sync).
kube-prometheus-stack:
  crds:
    enabled: false
  alertmanager:
    enabled: false
  # Tắt admission webhook + TLS của prometheus-operator:
  #   - admissionWebhooks.enabled=false  → không tạo webhook/hook job (tránh PreSync hooks kẹt ArgoCD)
  #   - tls.enabled=false                → operator KHÔNG mount secret <rel>-kube-promethe-admission
  #     (nếu chỉ tắt webhook mà để tls.enabled=true, operator vẫn bắt buộc có secret admission
  #      do hook job tạo → khi tắt webhook job không chạy → thiếu secret → operator ContainerCreating)
  prometheusOperator:
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false

  # ─── Prometheus ───
  prometheus:
    prometheusSpec:
      retention: 7d
      retentionSize: 5GB
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 500m, memory: 1Gi }
      # Cho phép chọn ServiceMonitor từ mọi namespace
      serviceMonitorSelectorNilUsesHelmValues: false

  # ─── Grafana ───
  # Admin credentials đọc TRỰC TIẾP từ Vault (Vault Agent Injector → file,
  # Grafana đọc qua GF_SECURITY_ADMIN_*__FILE). Không dùng ESO.
  grafana:
    podAnnotations:
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/role: "techshop"
      vault.hashicorp.com/agent-inject-status: "update"
      vault.hashicorp.com/agent-requests-cpu: "100m"
      vault.hashicorp.com/agent-limits-cpu: "250m"
      vault.hashicorp.com/agent-init-requests-cpu: "100m"
      vault.hashicorp.com/agent-init-limits-cpu: "250m"
      vault.hashicorp.com/agent-inject-secret-grafana-admin-password: "secret/data/grafana"
      vault.hashicorp.com/agent-inject-template-grafana-admin-password: |
        {{"{{"}} with secret "secret/data/grafana" }}{{"{{"}} .Data.data.admin_password }}{{"{{"}} end }}
      vault.hashicorp.com/agent-inject-secret-grafana-admin-user: "secret/data/grafana"
      vault.hashicorp.com/agent-inject-template-grafana-admin-user: |
        {{"{{"}} with secret "secret/data/grafana" }}{{"{{"}} .Data.data.admin_username }}{{"{{"}} end }}
    env:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /vault/secrets/grafana-admin-password
      GF_SECURITY_ADMIN_USER__FILE: /vault/secrets/grafana-admin-user
    service:
      type: ClusterIP
      port: 80
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
    dashboards:
      default:
        node-exporter-full:
          gnetId: 1860
          datasource: Prometheus

  # ─── Node Exporter ───
  prometheus-node-exporter:
    enabled: true

  # ─── kube-state-metrics ───
  kube-state-metrics:
    enabled: true

monitoring:
  enabled: true

  # ─── Loki (log aggregation) — tắt vì OOM trên t3.medium ───
  loki:
    enabled: false

  # ─── Promtail (log collector) ───
  promtail:
    enabled: false
    resultsCache:
      enabled: false
  # ─── Resources cho SingleBinary ───
  singleBinary:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }
  # ─── AWS credentials từ EC2 instance profile ───
  extraEnv:
    - name: AWS_REGION
      value: ap-southeast-1