{{- if .Values.backend.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres:5432 ..."
              for i in $(seq 1 60); do
                if nc -z postgres 5432 2>/dev/null; then
                  echo "Postgres is ready!"
                  exit 0
                fi
                sleep 2
              done
              echo "Timeout waiting for postgres"
              exit 1
        - name: prisma-migrate
          image: {{ .Values.images.backend }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args: ["npx prisma db push"]
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-env-secret }   # mentor: secret do Ansible/pipeline tạo từ Vault
      containers:
        - name: backend
          image: {{ .Values.images.backend }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args: ["exec node dist/index.js"]
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-env-secret }   # DATABASE_URL + JWT_SECRET từ Vault (pipeline tạo)
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - backend
                        - vault
                        - postgres
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
  strategy:
    canary:
      maxSurge: "25%"
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause: { duration: 30 }
        # Phải PASS analysis (error-rate < 1% && p95 < 0.5s) mới sang bước tiếp.
        # Fail (error >= 5% hoặc p95 >= 1.5s) 3 lần → auto rollback về stable.
        - analysis:
            templates:
              - templateName: backend-error-rate
        - setWeight: 50
        - pause: { duration: 30 }
        - analysis:
            templates:
              - templateName: backend-error-rate
        - setWeight: 80
        - pause: { duration: 30 }
        - analysis:
            templates:
              - templateName: backend-error-rate
      stableService: backend
      canaryService: backend-canary
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
  selector:
    app: backend
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
  selector:
    app: backend
  type: ClusterIP
{{- end }}