{{- if .Values.backend.enabled }}
# ─── Traffic generator nền (cho AnalysisTemplate service=backend) ───
# Mỗi phút bắn request vào /api qua ingress controller (Host header)
# → Prometheus có metric nginx_ingress_controller_requests{service="backend"}
# → analysis có số liệu thật (không "pass trống" vì thiếu traffic).
# 30 request/phút (1 mỗi 2s, liên tục) → mỗi cửa sổ 15s của analysis có ~7 request → đo tin cậy.
# Cần rate limit backend ≥ 1000 req/15min (đã nâng max trong backend/src/index.ts):
#   30 × 15 = 450 < 1000 ✅ (không bị 429)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: api-traffic-generator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: generator
              image: curlimages/curl:8.9.1
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  CONTROLLER="https://{{ .Release.Name }}-ingress-nginx-controller"
                  HOST="{{ .Values.ingress.host }}"
                  echo "== traffic generator: $HOST/api/health =="
                  for i in $(seq 1 30); do
                    code=$(curl -sk --max-time 5 -o /dev/null -w "%{http_code}" -H "Host: $HOST" "$CONTROLLER/api/health" || echo "000")
                    echo "req $i -> $code"
                    sleep 2
                  done
                  echo "traffic-done"
{{- end }}
