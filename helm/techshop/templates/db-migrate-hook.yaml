{{- if .Values.backend.enabled }}
# ── PreSync Hook: chạy migration trước khi deploy backend mới ──
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.images.backend }}
          command:
            - sh
            - -c
            - |
              echo "Running Prisma migration..."
              npx prisma db push
          env:
            - name: DATABASE_URL
              value: {{ .Values.config.databaseUrl | quote }}
            - name: JWT_SECRET
              value: {{ .Values.config.jwtSecret | quote }}
{{- end }}
