{{- if not (lookup "v1" "Secret" .Values.namespace "backend-secrets") }}
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: "Skip"
    # Secret này là fallback — ưu tiên dùng bản do External Secrets đồng bộ từ Vault
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:password@postgres:5432/shopdb?schema=public"
  JWT_SECRET: "fallback-change-me"
{{- end }}
