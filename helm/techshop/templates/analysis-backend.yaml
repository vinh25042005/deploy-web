{{- if and .Values.monitoring.enabled .Values.backend.enabled }}
# ─── AnalysisTemplate: đánh giá sức khỏe version mới trong canary bằng Prometheus ───
# Metric lấy từ ingress-nginx (đã bật metrics.enabled + ServiceMonitor trong values.yaml)
# Query đo tỷ lệ 5xx + latency p95 của traffic vào service "backend" (route /api).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-error-rate
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # tạo trước Rollout (sync-wave 1)
spec:
  metrics:
    # ── Tỷ lệ lỗi HTTP 5xx (service backend, route /api) ──
    # success khi < 1%; fail khi >= 5% (3 lần liên tiếp → rollback)
    - name: error-rate
      interval: 15s
      count: 4                 # đo 4 lần (4 × 15s = 60s) — bắt buộc, nếu thiếu sẽ chạy vô hạn
      successCondition: result[0] < 0.01
      failureCondition: result[0] >= 0.05
      failureLimit: 3
      provider:
        prometheus:
          address: {{ .Values.monitoring.prometheusAddress | default (printf "http://%s-kube-promethe-prometheus:9090" .Release.Name) }}
          query: |
            (
              sum(rate(nginx_ingress_controller_requests{namespace="{{ .Values.namespace }}", exported_service="backend", status=~"5.."}[2m]))
              /
              clamp_min(sum(rate(nginx_ingress_controller_requests{namespace="{{ .Values.namespace }}", exported_service="backend"}[2m])), 1)
            ) or vector(0)
{{- end }}
