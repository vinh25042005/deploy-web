{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.backendSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: database
        property: url
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt
        property: secret
---
{{- end }}
{{- if .Values.externalSecrets.postgresCredentials }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgres
        property: password
---
{{- end }}
{{- if .Values.externalSecrets.grafanaAdmin }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    # Grafana deployment cần đúng key admin-password (gạch ngang) + admin-user
    - secretKey: admin-password
      remoteRef:
        key: grafana
        property: admin_password
    - secretKey: admin-user
      remoteRef:
        key: grafana
        property: admin_username
---
{{- end }}
{{- if .Values.externalSecrets.cosignPub }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cosign-pub
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: cosign-pub
    creationPolicy: Owner
  data:
    # Public key cosign — Kyverno verifyImages dùng attestors[].keys[].secret
    - secretKey: cosign.pub
      remoteRef:
        key: cosign
        property: public_key
{{- end }}
{{- end }}
