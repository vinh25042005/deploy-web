storage:
  ebsCSI:
    enabled: false       # Terraform cài cluster-wide trong kube-system — không env nào cần cài riêng

namespace: techshop-stg

images:
  backend: docker.io/vinh2504/deploy-web-backend:stg     # Rolling tag stg — Jenkins build ENV=stg sẽ push tag 'stg' + ghi .argocd-source override
  frontend: docker.io/vinh2504/deploy-web-frontend:stg   # Build đủ backend+frontend (BUILD_FULL) thì override sẽ có cả 2

backend:
  replicas: 2

frontend:
  replicas: 2

config:
  nodeEnv: staging

ingress-nginx:
  enabled: false          # Dùng chung Ingress Controller với dev

ingress:
  className: nginx        # Dùng chung ingress class với dev
  host: stg.techshop.local

monitoring:
  enabled: false    # Dùng chung monitoring stack với dev (cluster-scoped), không cần cài lại
