storage:
  ebsCSI:
    enabled: false       # Dùng chung với dev (cluster-scoped, chỉ cần 1 lần)

namespace: techshop-stg

images:
  backend: docker.io/vinh2504/deploy-web-backend:dev     # Tạm dùng dev tag vì chưa có Jenkins build cho stg
  frontend: docker.io/vinh2504/deploy-web-frontend:dev   # Sau khi Jenkins build ENV=stg, Image Updater sẽ tự cập nhật

backend:
  replicas: 2

frontend:
  replicas: 2

config:
  nodeEnv: staging

ingress-nginx:
  enabled: false          # Dùng chung Ingress Controller với dev

ingress:
  className: nginx        # Dùng chung ingress class với dev
  host: stg.techshop.local

monitoring:
  enabled: false    # Dùng chung monitoring stack với dev (cluster-scoped), không cần cài lại
