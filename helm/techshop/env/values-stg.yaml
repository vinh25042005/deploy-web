storage:
  ebsCSI:
    enabled: false       # Dùng chung với dev (cluster-scoped, chỉ cần 1 lần)

namespace: techshop-stg

images:
  backend: docker.io/vinh2504/deploy-web-backend:stg
  frontend: docker.io/vinh2504/deploy-web-frontend:stg

backend:
  replicas: 2

frontend:
  replicas: 2

config:
  nodeEnv: staging

ingress-nginx:
  enabled: false          # Dùng chung Ingress Controller với dev

ingress:
  className: nginx        # Dùng chung ingress class với dev
  host: stg.techshop.local

monitoring:
  enabled: true

  # ─── Dùng chung monitoring stack với dev (cluster-scoped) ───
  # Không cài lại Prometheus, Grafana, Node Exporter cho stg
  # Dev đã có đủ và scrape được metric từ mọi namespace
  kube-prometheus-stack:
    enabled: false
  loki:
    enabled: false
  promtail:
    enabled: false
