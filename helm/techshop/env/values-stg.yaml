storage:
  ebsCSI:
    enabled: false       # StorageClass chỉ tạo 1 lần, dev đã tạo rồi

namespace: techshop-stg

images:
  backend: docker.io/vinh2504/deploy-web-backend:stg
  frontend: docker.io/vinh2504/deploy-web-frontend:stg

backend:
  replicas: 2

frontend:
  replicas: 2

config:
  nodeEnv: staging

ingress-nginx:
  controller:
    hostNetwork: true
    kind: DaemonSet
    daemonset:
      useHostPort: true
    service:
      type: ClusterIP
    ingressClassResource:
      name: nginx-stg
      controllerValue: k8s.io/ingress-nginx-stg
      enabled: true
      default: false
    ingressClass: nginx-stg
    nodeSelector:
      role: ingress
    tolerations:
      - key: role
        operator: Equal
        value: ingress
        effect: NoSchedule
    admissionWebhooks:
      enabled: false

ingress:
  className: nginx-stg
  host: stg.techshop.local

monitoring:
  loki:
    enabled: false
  promtail:
    enabled: false
