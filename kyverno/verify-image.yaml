# ─── Kyverno ClusterPolicy: verify cosign signature trước khi deploy ─────
# Chặn mọi Pod (kể cả qua ArgoCD) nếu image docker.io/vinh2504/* KHÔNG có
# chữ ký cosign hợp lệ (public key từ Secret cosign-pub do ESO tạo từ Vault).
#
# Cách dùng:
#   - Bắt đầu với validationFailureAction: Audit (chỉ ghi báo cáo, không chặn)
#   - Khi đã chắc chắn mọi image đều được ký → chuyển thành Enforce để chặn thật
#
# Kiểm tra policy:
#   kubectl get clusterpolicy verify-image
#   kubectl get policyreport -n <ns>   # xem vi phạm ở mode Audit
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image
  annotations:
    policies.kyverno.io/title: Verify Cosign Image Signature
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Yêu cầu mọi image docker.io/vinh2504/* phải có chữ ký cosign hợp lệ.
      Public key đọc từ Secret cosign-pub (đồng bộ từ Vault qua External Secrets).
spec:
  validationFailureAction: Audit
  background: false
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - image: "docker.io/vinh2504/*"
          # Audit mode không được mutate image digest (bắt buộc của Kyverno)
          mutateDigest: false
          attestors:
            - count: 1
              entries:
                # keys.secret = object tham chiếu K8s Secret chứa public key
                # (Secret cosign-pub do External Secrets tạo từ Vault, namespace techshop-stg).
                # Cú pháp Kyverno mới: secret là OBJECT { name, namespace }.
                - keys:
                    secret:
                        name: cosign-pub
                        namespace: techshop-stg
